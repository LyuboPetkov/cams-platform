services:

  db:
    # postgres:18-alpine has no vector extension available; pgvector/pgvector
    # is the official postgres image with pgvector pre-installed, matching the
    # same major version (Phase 16 needs CREATE EXTENSION vector — see V18).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: cams_db
      POSTGRES_USER: cams_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    # Phase 18: scripts/matching-eval/evaluate_matching.py connects to Postgres
    # directly from the host via psycopg, with no dependency on the backend
    # being up, so the port needs to reach the host, not just other containers.
    # Host side is 5433, not 5432: a native Windows Postgres service also binds
    # 5432, and the two competing for the same host port caused two separate
    # phases (20, 21a) to land on whichever one happened to win nondeterministically
    # (Phase 21b Section 3.7). Container-to-container traffic (SPRING_DATASOURCE_URL
    # below, and the backend service in docker-compose.yml) still targets db:5432 —
    # only the host-facing side changes.
    ports:
      - "5433:5432"
    networks:
      - cams-network

  # Model weights are downloaded from Hugging Face on first build/run, so the
  # first `docker compose up --build` needs network access for this service.
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    networks:
      - cams-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cams_db
      SPRING_DATASOURCE_USERNAME: cams_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      TZ: Europe/Sofia
    depends_on:
      db:
        condition: service_started
      embedding-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - cams-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        NGINX_CONF: nginx.local.conf
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cams-network

networks:
  cams-network:
    driver: bridge

volumes:
  postgres_data: