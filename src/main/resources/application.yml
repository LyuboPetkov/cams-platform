spring:
  application:
    name: cams

  datasource:
    # Host-side Postgres port is 5433, not 5432 — see docker-compose.local.yml's
    # db service comment (Phase 21b Section 3.7). Override with DB_URL if
    # connecting to a Postgres instance on a different host/port.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cams_db}
    username: cams_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000 # 24 hours in milliseconds
  embedding-service:
    base-url: ${EMBEDDING_SERVICE_URL:http://localhost:8000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

kind: Application